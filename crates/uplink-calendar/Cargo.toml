[package]
name = "uplink-calendar"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1"
mail-parser = "0.11.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
uplink-config = { path = "../uplink-config" }
uplink-email = { path = "../uplink-email" }
uplink-protocol = { path = "../uplink-protocol" }
uplink-query = { path = "../uplink-query" }
uplink-storage = { path = "../uplink-storage" }
uplink-tx-log = { path = "../uplink-tx-log" }

[dev-dependencies]
base64 = "0.22"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "rt-multi-thread", "time"] }
uplink-realtime = { path = "../uplink-realtime" }
url = "2.5.8"
