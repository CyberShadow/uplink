[package]
name = "uplink-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "uplink"
path = "src/main.rs"

[dependencies]
uplink-server = { path = "../uplink-server" }
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
uplink-email = { version = "0.1.0", path = "../uplink-email" }
uplink-config = { version = "0.1.0", path = "../uplink-config" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
