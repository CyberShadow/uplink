[package]
name = "uplink-realtime"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
uplink-protocol = { path = "../uplink-protocol" }

anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros"] }
tracing = "0.1"
