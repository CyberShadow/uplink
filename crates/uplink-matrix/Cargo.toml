[package]
name = "uplink-matrix"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
uplink-realtime = { path = "../uplink-realtime" }
ammonia = "4.2.4"
uplink-config = { path = "../uplink-config" }
uplink-protocol = { path = "../uplink-protocol" }
uplink-query = { path = "../uplink-query" }
uplink-storage = { path = "../uplink-storage" }
uplink-tx-log = { path = "../uplink-tx-log" }
anyhow = "1"
base64 = "0.22"
matrix-sdk = { version = "0.19.1", default-features = false, features = ["sqlite", "e2e-encryption", "markdown", "rustls-aws-lc-rs"] }
mime = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"

[dev-dependencies]
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
url = "2.5.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
