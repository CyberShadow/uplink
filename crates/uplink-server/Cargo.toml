[package]
name = "uplink-server"
version = "0.1.0"
edition = "2021"

[dependencies]
uplink-calendar = { path = "../uplink-calendar" }
uplink-config = { path = "../uplink-config" }
uplink-protocol = { path = "../uplink-protocol" }
uplink-realtime = { path = "../uplink-realtime" }
uplink-storage = { path = "../uplink-storage" }
uplink-tx-log = { path = "../uplink-tx-log" }

anyhow = "1"
arc-swap = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
bcrypt = "0.17"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = "0.5"
tracing = "0.1"
uplink-email = { version = "0.1.0", path = "../uplink-email" }
uplink-matrix = { path = "../uplink-matrix" }
uplink-todos = { path = "../uplink-todos" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
uplink-tx-log = { path = "../uplink-tx-log", features = ["test-ops"] }

axum = { version = "0.7", features = ["macros"] }
futures-util = "0.3"
hex = "0.4"
http-body-util = "0.1"
rcgen = "0.13"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }
