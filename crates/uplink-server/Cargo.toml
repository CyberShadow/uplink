[package]
name = "uplink-server"
version = "0.1.0"
edition = "2021"

[dependencies]
uplink-config = { path = "../uplink-config" }

anyhow = "1"
arc-swap = "1"
axum = "0.7"
base64 = "0.22"
bcrypt = "0.17"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
mime_guess = "2"
rust-embed = { version = "8", features = ["debug-embed"] }
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.7", features = ["macros"] }
hex = "0.4"
http-body-util = "0.1"
rcgen = "0.13"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
