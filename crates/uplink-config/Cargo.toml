[package]
name = "uplink-config"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
uplink-query = { path = "../uplink-query" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1"
notify = "6"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "time"] }
