[package]
name = "uplink-email"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
ammonia = "4.2.4"
cssparser = "0.38.0"
html5ever = "0.40.1"
markup5ever_rcdom = "0.40.1"
anyhow = "1.0.104"
base64 = "0.22"
chacha20poly1305 = "0.11.0"
futures-util = "0.3.34"
mail-builder = "2.0.1"
mail-parser = "0.11.9"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
uplink-config = { version = "0.1.0", path = "../uplink-config" }
uplink-protocol = { version = "0.1.0", path = "../uplink-protocol" }
uplink-query = { version = "0.1.0", path = "../uplink-query" }
uplink-storage = { version = "0.1.0", path = "../uplink-storage" }
uplink-tx-log = { version = "0.1.0", path = "../uplink-tx-log" }
url = "2.5.8"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
mail-send = { version = "0.7.0", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7.1"

[dev-dependencies]
rcgen = "0.13.2"
serde_yaml = "0.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "rt-multi-thread", "test-util", "time"] }
uplink-realtime = { path = "../uplink-realtime" }
uplink-tx-log = { path = "../uplink-tx-log", features = ["test-ops"] }
