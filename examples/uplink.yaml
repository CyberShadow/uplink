# uplink's configuration; see README.md. `uplink init` writes this file,
# with the user and password it asks for. Relative paths are relative to
# this file's directory.

server:
  bind: "127.0.0.1:8443"
  # Without `tls`, uplink speaks plain HTTP: for a reverse proxy in front
  # that terminates TLS (e.g. Caddy), or for loopback only. Changes to the
  # certificate apply without a restart.
  # tls:
  #   cert: /path/to/cert.pem   # PEM, full chain
  #   key: /path/to/key.pem     # PEM, unencrypted
  basic_auth:
    user: alice
    # bcrypt hash of "uplink": a well-known password, for trying uplink on
    # loopback only. `uplink init` writes your own instead; make one by
    # hand with: uplink hash-password
    password_bcrypt: "$2b$12$Z5QelJuvdiqVHbPGIlx/d.zNmaHFLs5vXr41y3ucCcBkndL6tErju"

# Everything uplink keeps: the database, mail, the master key sealing
# accounts' tokens, and Matrix stores.
data_dir: ./data

# How long sent mail waits in the outbox, during which sending can be
# undone.
send_delay_secs: 10

# Add accounts below (and drop the `[]`), then restart `uplink serve`.
accounts: []

  # — Gmail — with an OAuth client of your own (see README.md); then run
  # `uplink oauth init --account alice-gmail`.
  # - id: alice-gmail
  #   kind: gmail
  #   address: alice@gmail.com
  #   oauth:
  #     client_id: "1234.apps.googleusercontent.com"
  #     client_secret: "GOCSPX-xxxxxxxxxx"

  # — Microsoft 365 — with an app registration of your own (see
  # README.md); then run `uplink oauth init --account alice-m365`.
  # - id: alice-m365
  #   kind: m365
  #   address: alice@example.com
  #   oauth:
  #     client_id: "11111111-2222-3333-4444-555555555555"

  # — Matrix — run `uplink matrix pair --account alice-matrix`.
  # - id: alice-matrix
  #   kind: matrix
  #   homeserver: "https://matrix.example.org"
  #   mxid: "@alice:example.org"
