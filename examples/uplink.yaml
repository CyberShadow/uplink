# uplink sample / development configuration
# All fields parsed; server.* and data.* are consumed so far.
# DO NOT USE IN PRODUCTION — credentials and certs are obvious placeholders.

# ── server ──────────────────────────────────────────────────────────────────
server:
  bind: "127.0.0.1:8443"
  tls:
    cert: "examples/dev-cert.pem"   # PEM, full chain
    key:  "examples/dev-key.pem"    # PEM, unencrypted
  basic_auth:
    user: alice
    # bcrypt hash of "uplink" (cost 12). Generate a fresh one with:
    #   htpasswd -bnBC 12 "" yourpassword | tr -d ':\n'
    password_bcrypt: "$2b$12$Z5QelJuvdiqVHbPGIlx/d.zNmaHFLs5vXr41y3ucCcBkndL6tErju"

# ── data location ───────────────────────────────────────────────────────────
data:
  root: ./data   # created on first run

# ── master key ──────────────────────────────────────────────────────────────
# 32-byte random key, base64. Used to seal OAuth refresh tokens at rest.
# Generate with: uplink keygen > master.key
master_key_file: ./master.key

# ── accounts ────────────────────────────────────────────────────────────────
accounts:

  # — Gmail —
  - id: alice-gmail
    kind: gmail
    address: alice@gmail.com
    oauth:
      client_id:     "1234.apps.googleusercontent.com"
      client_secret: "GOCSPX-xxxxxxxxxx"
      token_file:    ./data/accounts/alice-gmail.token

  # — Microsoft 365 —
  - id: alice-m365
    kind: m365
    address: alice@example.com
    oauth:
      client_id: "d3590ed6-52b3-4102-aeff-aad2292ab01c"
      authority: "https://login.microsoftonline.com/common"
      resource: "https://graph.microsoft.com"
      token_file: ./data/accounts/alice-m365.token

  # — Matrix —
  - id: alice-matrix
    kind: matrix
    homeserver: "https://matrix.example.org"
    mxid: "@alice:example.org"
    state_dir: ./data/matrix/alice-matrix
