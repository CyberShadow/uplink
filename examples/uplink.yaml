# uplink sample / development configuration
# DO NOT USE IN PRODUCTION — cert is a self-signed dev fixture.

server:
  bind: "127.0.0.1:8443"
  tls:
    cert: "examples/dev-cert.pem"
    key:  "examples/dev-key.pem"
  basic_auth:
    user: alice
    # bcrypt hash of "uplink" (cost 12).  Generate a fresh one with:
    #   htpasswd -bnBC 12 "" yourpassword | tr -d ':\n'
    password_bcrypt: "$2b$12$Z5QelJuvdiqVHbPGIlx/d.zNmaHFLs5vXr41y3ucCcBkndL6tErju"
