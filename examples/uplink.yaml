# uplink's configuration; see README.md. `uplink init` writes this file,
# with the user and password it asks for. Relative paths are relative to
# this file's directory.

server:
  bind: "127.0.0.1:8443"
  # Without `tls`, uplink speaks plain HTTP: for a reverse proxy in front
  # that terminates TLS (e.g. Caddy), or for loopback only. Changes to the
  # certificate apply without a restart.
  # tls:
  #   cert: /path/to/cert.pem   # PEM, full chain
  #   key: /path/to/key.pem     # PEM, unencrypted
  basic_auth:
    user: alice
    # bcrypt hash of "uplink": a well-known password, for trying uplink on
    # loopback only. `uplink init` writes your own instead; make one by
    # hand with: uplink hash-password
    password_bcrypt: "$2b$12$Z5QelJuvdiqVHbPGIlx/d.zNmaHFLs5vXr41y3ucCcBkndL6tErju"

# Everything uplink keeps: the database, mail, the master key sealing
# accounts' tokens, and Matrix stores.
data_dir: ./data

# How long sent mail waits in the outbox, during which sending can be
# undone.
send_delay_secs: 10

# The home page's buckets, top to bottom, each a search (see the app's
# search help): mail, rooms, to-dos or events land in the first bucket
# that matches them. `badge: count` shows how many are in a bucket on
# the app's icon, `badge: dot` a dot while any is. Without `home`,
# these. Changes apply without a restart.
home:
  - name: Immediate
    query: is:mention OR is:invite OR (is:dm is:unread) OR is:overdue
      OR due:today OR (in:inbox is:unread is:important)
    badge: count
  - name: Upkeep
    query: (is:unread is:notifying -tag:lowpriority)
      OR (in:inbox -category:promotions -category:social)
    badge: dot
  - name: Backlog
    query: is:starred OR is:todo
  - name: Leisure
    query: is:unread

# The calendar's week shows the hours in the browser's time zone; these
# add columns of them in other zones (IANA names), left of it. Changes
# apply without a restart.
# calendar:
#   time_zones:
#     - label: Home
#       zone: Europe/Lisbon
#     - label: Office
#       zone: Europe/Berlin

# Mail's remote images are fetched by the server, from public addresses
# only, so that a mail cannot make it reach your network. Hosts in
# `private_hosts` are fetched from though they resolve to private
# addresses (e.g. your intranet's GitLab). Those in `direct_hosts` your
# browser loads itself, signed in, for images only those signed in get
# (GitLab's avatars); in Firefox, turn off Enhanced Tracking Protection
# for uplink, or it sends no cookies. Exact names; any mail's images of
# them load. Changes apply without a restart (reload the app for
# `direct_hosts`).
# remote_images:
#   private_hosts:
#     - git.example.org
#   direct_hosts:
#     - git.example.org

# Add accounts below (and drop the `[]`), then restart `uplink serve`.
accounts: []

  # — Gmail — with an OAuth client of your own (see README.md); then run
  # `uplink oauth init --account alice-gmail`.
  # - id: alice-gmail
  #   kind: gmail
  #   address: alice@gmail.com
  #   oauth:
  #     client_id: "1234.apps.googleusercontent.com"
  #     client_secret: "GOCSPX-xxxxxxxxxx"
  #     project: "uplink-123456"     # the client's Google Cloud project's ID

  # — Microsoft 365 — with an app registration of your own (see
  # README.md); then run `uplink oauth init --account alice-m365`.
  # - id: alice-m365
  #   kind: m365
  #   address: alice@example.com
  #   oauth:
  #     client_id: "11111111-2222-3333-4444-555555555555"

  # — Any other mail account — IMAP and SMTP over TLS, on ports 993 and
  # 465 unless `port` says otherwise; `security: starttls` for STARTTLS
  # (ports 143 and 587). Then run `uplink password --account alice-mail`,
  # or, with an `oauth` block (see README.md), `uplink oauth init`.
  # - id: alice-mail
  #   kind: imap
  #   address: alice@example.org
  #   imap:
  #     host: imap.example.org
  #   smtp:
  #     host: smtp.example.org

  # — A mail account read by POP3 — as the IMAP one, but ports 995 and 110.
  # Mail is downloaded and left on the server, unless
  # `delete_after_download: true`.
  # - id: alice-pop
  #   kind: pop3
  #   address: alice@example.net
  #   pop3:
  #     host: pop.example.net
  #   smtp:
  #     host: smtp.example.net

  # — A mail account read by JMAP (Stalwart, Fastmail, …) — its session
  # URL, over https; then `uplink password --account alice-jmap`, or, with
  # an `oauth` block, `uplink oauth init`.
  # - id: alice-jmap
  #   kind: jmap
  #   address: alice@example.com
  #   session_url: "https://mail.example.com/.well-known/jmap"

  # — Matrix — run `uplink matrix pair --account alice-matrix`.
  # - id: alice-matrix
  #   kind: matrix
  #   homeserver: "https://matrix.example.org"
  #   mxid: "@alice:example.org"
