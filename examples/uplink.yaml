# uplink development configuration: copy it, then fill in your account.
# The certificate and password are public placeholders; see README.md.

# ── server ──────────────────────────────────────────────────────────────────
server:
  bind: "127.0.0.1:8443"
  tls:
    cert: "examples/dev-cert.pem"   # PEM, full chain
    key:  "examples/dev-key.pem"    # PEM, unencrypted
  basic_auth:
    user: alice
    # bcrypt hash of "uplink". Make your own with: uplink hash-password
    password_bcrypt: "$2b$12$Z5QelJuvdiqVHbPGIlx/d.zNmaHFLs5vXr41y3ucCcBkndL6tErju"

# ── data location ───────────────────────────────────────────────────────────
data:
  root: ./data   # created on first run

# ── master key ──────────────────────────────────────────────────────────────
# 32-byte random key, base64. Seals OAuth refresh tokens at rest.
# Generate with: uplink keygen > master.key && chmod 600 master.key
master_key_file: ./master.key

# How long sent mail waits in the outbox, during which sending can be
# undone.
send_delay_secs: 10

# ── accounts ────────────────────────────────────────────────────────────────
accounts:

  # — Gmail — (see README.md for the client id and secret)
  - id: alice-gmail
    kind: gmail
    address: alice@gmail.com
    oauth:
      client_id:     "1234.apps.googleusercontent.com"
      client_secret: "GOCSPX-xxxxxxxxxx"
      token_file:    ./data/accounts/alice-gmail.token   # written by `uplink oauth init`

  # — Matrix — pair it once with `uplink matrix pair --account alice-matrix`.
  # - id: alice-matrix
  #   kind: matrix
  #   homeserver: "https://matrix.example.org"
  #   mxid: "@alice:example.org"
  #   state_dir: ./data/matrix/alice-matrix
  #
  # — Microsoft 365 — signed in as the Outlook desktop client
  # (`uplink oauth init`; see README).
  # - id: alice-m365
  #   kind: m365
  #   address: alice@example.com
  #   oauth:
  #     client_id: "d3590ed6-52b3-4102-aeff-aad2292ab01c"
  #     authority: "https://login.microsoftonline.com/common"
  #     resource: "https://graph.microsoft.com"
  #     token_file: ./data/accounts/alice-m365.token
