[workspace]
resolver = "2"
members = [
    "crates/uplink-protocol",
    "crates/uplink-config",
    "crates/uplink-storage",
    "crates/uplink-tx-log",
    "crates/uplink-realtime",
    "crates/uplink-query",
    "crates/uplink-email",
    "crates/uplink-matrix",
    "crates/uplink-calendar",
    "crates/uplink-todos",
    "crates/uplink-server",
    "crates/uplink-cli",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.metadata.crane]
name = "uplink"

# Dependencies optimized, though the workspace is not: the tests, in the
# dev shell, spend most of their time in matrix-sdk's cryptography
# (its store's passphrase, Olm, key exports), which unoptimized is many
# times slower (a Conduit test taking a minute rather than seconds).
# `nix flake check` builds with the release profile, which this leaves be.
[profile.dev.package."*"]
opt-level = 2

# Dependencies patched until upstream has the fix: see each one's
# PATCHED.md.
[patch.crates-io]
matrix-sdk-base = { path = "vendor/matrix-sdk-base" }
