[workspace]
resolver = "2"
members = [
    "crates/uplink-protocol",
    "crates/uplink-config",
    "crates/uplink-storage",
    "crates/uplink-tx-log",
    "crates/uplink-realtime",
    "crates/uplink-email",
    "crates/uplink-matrix",
    "crates/uplink-calendar",
    "crates/uplink-todos",
    "crates/uplink-server",
    "crates/uplink-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.metadata.crane]
name = "uplink"
