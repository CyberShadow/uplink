<!-- The logo without its frame, full bleed, for devices which mask app icons
     into shapes of their own; the horizon reaches the edges. -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#000"/>
  <!-- Atmosphere: two dark blue bands hugging the horizon; the planet covers their lower halves. -->
  <path d="M0 24.22Q16 13.78 32 24.22" fill="none" stroke="#000E33" stroke-width="10"/>
  <path d="M0 24.22Q16 13.78 32 24.22" fill="none" stroke="#001F5C" stroke-width="5"/>
  <g fill="#fff">
    <rect x="6" y="10" width="2" height="2"/>
    <rect x="24" y="12" width="2" height="2"/>
    <rect x="22" y="6" width="2" height="2" opacity=".8"/>
    <rect x="10" y="16" width="2" height="2" opacity=".8"/>
    <rect x="8" y="6" width="2" height="2" opacity=".7"/>
    <rect x="24" y="18" width="2" height="2" opacity=".7"/>
  </g>
  <path d="M0 24.22Q16 13.78 32 24.22V32H0z" fill="#004D00"/>
  <path d="M9 20Q16 18 23 20Q16 25.5 9 20z" fill="#008000"/>
  <path d="M7 24.5q3-2 5.5-1q1.5 2-1 3.5q-3.5 1-4.5-2.5z" fill="#00474D"/>
  <path d="M19.5 25q3.5-1.5 5.5.5q.5 2.5-2.500 3q-3 0-3-3.5z" fill="#00474D"/>
  <path d="M0 24.22Q16 13.78 32 24.22" fill="none" stroke="#C0C0C0" stroke-width="1.4"/>
  <rect x="12" y="0" width="8" height="19" fill="#00FFFF" opacity=".18"/>
  <rect x="14" y="0" width="4" height="20" fill="#00FFFF"/>
</svg>
